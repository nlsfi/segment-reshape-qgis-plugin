[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "segment-reshape-qgis-plugin"
dynamic = ["version"]
description = "QGIS plugin with a map tool to reshape a continuous segment topogically."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "National Land Survey of Finland", email = "os@nls.fi" }]
keywords = ["qgis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "qgis_plugin_tools",
]

[project.urls]
Changelog = "https://github.com/nlsfi/segment-reshape-qgis-plugin/blob/main/CHANGELOG.md"
Homepage = "https://github.com/nlsfi/segment-reshape-qgis-plugin"

[project.entry-points."qgis_plugin_dev_tools"]
segment_reshape_plugin = "segment_reshape_plugin"

[dependency-groups]
dev = [
    "qgis-plugin-dev-tools",
    "uv",
]
test = [
    # lock here since 1.4.1 has no binaries
    "atomicwrites==1.4.0",
    "pyqt5-stubs",
    "pytest",
    "pytest-qt",
    "pytest-cov",
    "pytest-mock",
    "pytest-qgis==2.1.0",
    "pytest-timeout",
    "pytest-order",
    "pytest-dotenv",
    # Pin version for python 3.12 support
    "coverage[toml]==7.2.7",
]
lint = [
    "pre-commit",
    "mypy",
    "black",
    "ruff",
    # flake8 libraries not included in ruff
    "flake8",
    "flake8-pyproject",
    "flake8-spellcheck",
    "flake8-qgis",
]

[tool.uv]
default-groups = ["dev", "test", "lint"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "segment_reshape.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
segment_reshape = ["py.typed"]
segment_reshape_plugin = ["py.typed", "metadata.txt", "**/*.svg", "**/*.ts"]

[tool.ruff]
ignore = [
    "ANN101", # Missing type annotation for self in method
    ]
line-length = 88

# List of all rules https://docs.astral.sh/ruff/rules/
select = [
    "ANN", # flake8-annotations
    "B", # flake8-bugbear
    "C", # flake8-comprehensions
    "C90", # flake8, mccabe
    "E", # flake8, pycodestyle
    "F", # flake8, Pyflakes
    "I", # isort
    "INP", # flake8-no-pep420
    "N", # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "PL", # pylint
    "PT", # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "T", # flake8-print
    "ICN", # flake8-import-conventions
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "W", # flake8, pycodestyle
    "UP", # pyupgrade
    ]

# Avoiding flagging (and removing) `SC200` from any `# noqa`
# directives, despite Ruff's lack of support for `flake8-spellcheck`.
external = ["SC200"]

target-version = "py39"

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
"test*" = [
    "INP001",
    "ANN201",
    "ANN202",
    "E501",
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "PLR0913", # Too many arguments to function call (len(args) > 5)
    ]


[tool.flake8]
max-line-length = 88
spellcheck-targets = "names"
dictionaries = "en_US,python,technical"
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line length (checked by ruff now, possible mismatches)
]
per-file-ignores = [
    "test/*:INP001,SC200,QGS105",
]

[tool.mypy]
follow_imports = "normal"
show_column_numbers = true

[tool.pytest.ini_options]
minversion = "6.0"

[tool.qgis_plugin_dev_tools]
plugin_package_name = "segment_reshape_plugin"
runtime_requires = [
    "qgis_plugin_tools",
    "segment-reshape-qgis-plugin",
]
version_number_source = "distribution"
